<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Jurnal Servis</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b7a86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurnal Servis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Susun atur: papan ringkasan di atas (status + graf kos), kemudian kad item mengikut keutamaan servis. */
:root{
  --bg:#edf2f1; --surface:#ffffff; --surface2:#f4f8f7; --ink:#10282b; --muted:#5b7174; --line:#d5e0de;
  --accent:#0b7a86; --accent-ink:#ffffff; --accent-soft:#d9eef0;
  --ok:#1b7f4b; --ok-bg:#dcf3e5; --warn:#8f5400; --warn-bg:#fdeacb; --bad:#b3261e; --bad-bg:#fbdcd9;
  --shadow:0 1px 2px rgba(16,40,43,.06),0 8px 24px rgba(16,40,43,.06);
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1819; --surface:#132527; --surface2:#183033; --ink:#e6f2f1; --muted:#92aeb0; --line:#26413f;
    --accent:#38c0cc; --accent-ink:#06282b; --accent-soft:#12383c;
    --ok:#5fd38d; --ok-bg:#12372a; --warn:#f2b45a; --warn-bg:#3d2c0e; --bad:#ff8f86; --bad-bg:#40191a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1819; --surface:#132527; --surface2:#183033; --ink:#e6f2f1; --muted:#92aeb0; --line:#26413f;
  --accent:#38c0cc; --accent-ink:#06282b; --accent-soft:#12383c;
  --ok:#5fd38d; --ok-bg:#12372a; --warn:#f2b45a; --warn-bg:#3d2c0e; --bad:#ff8f86; --bad-bg:#40191a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);
  padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand h1{font-size:1.5rem;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px}
.chip-sync{font-size:.78rem;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip-sync.on i{background:var(--ok)} .chip-sync.busy i{background:var(--warn)} .chip-sync.err i{background:var(--bad)}

.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.banner span{flex:1;min-width:220px}

/* ringkasan */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:1rem;margin-bottom:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.76rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border-radius:12px;padding:12px 14px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.stat b{font:600 1.9rem/1.1 var(--font-d)}
.stat small{color:var(--muted)}
.stat.bad{background:var(--bad-bg);color:var(--bad)} .stat.bad small{color:inherit}
.stat.warn{background:var(--warn-bg);color:var(--warn)} .stat.warn small{color:inherit}
.stat.ok{background:var(--ok-bg);color:var(--ok)} .stat.ok small{color:inherit}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chart-head b{font:600 1.35rem var(--font-d)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--font-b)}
svg.chart .val{fill:var(--ink);font-weight:600}
svg.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
svg.chart rect.bar{fill:var(--accent);opacity:.35;transition:opacity .15s}
svg.chart rect.bar.cur{opacity:1}
svg.chart g:hover rect.bar{opacity:1}

/* kawalan */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab small{opacity:.7}
.search{flex:0 1 220px;min-width:140px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}

/* kad */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.sub{margin:1px 0 0;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.card-top>div{flex:1;min-width:0}
.pill{font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.none{background:var(--surface2);color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.warn i{background:#e09b1f} .meter.bad i{background:var(--bad)} .meter.none i{background:var(--line)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0;font-size:.84rem}
.facts div{min-width:0}
.facts dt{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.card-actions{display:flex;gap:8px;margin-top:auto}
.tag{font-size:.7rem;background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:middle}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* dialog */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,22,.55);backdrop-filter:blur(3px)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dlg-head h2{font-size:1.25rem}
.x{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kat-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.kat-pick label{cursor:pointer}
.kat-pick input{position:absolute;opacity:0;pointer-events:none}
.kat-pick span{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--ink);text-align:center}
.kat-pick svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kat-pick input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kat-pick input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* sejarah */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-height:46vh;overflow:auto}
.hist li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.hist li::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.hist li:last-child::before{display:none}
.hist .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:4px;box-shadow:0 0 0 4px var(--accent-soft)}
.hist .row1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hist b{font-family:var(--font-d)}
.hist .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.hist .thumb{margin-top:6px;display:inline-flex;gap:8px;align-items:center;font-size:.82rem}
.hist img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:.85rem}
.sum b{font-family:var(--font-d);font-size:1.05rem;display:block}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6a4 4 0 0 0 4.7 5L10 20.2a2.1 2.1 0 0 1-3-3L16 8.4"/><path d="M14 6l3-3 3 3-3 3"/></svg></div>
      <div><h1>Jurnal Servis</h1><p>Kenderaan &amp; peralatan, semuanya di satu tempat</p></div>
    </div>
    <span class="chip-sync" id="sync"><i></i><span>Tempatan</span></span>
    <button class="btn" id="btnInstall" hidden>Pasang app</button>
    <button class="btn" id="btnSet" aria-label="Tetapan sambungan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Sambungan</button>
    <button class="btn primary" id="btnAddItem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Tambah item</button>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="bannerText"></span>
    <button class="btn sm" id="btnClearDemo">Padam data contoh</button>
  </div>

  <section class="board" aria-label="Ringkasan">
    <div class="panel">
      <h2>Status servis</h2>
      <div class="stats" id="stats"></div>
    </div>
    <div class="panel">
      <h2>Kos servis, 6 bulan terakhir</h2>
      <div class="chart-head"><b class="num" id="chartTotal"></b><span class="hint" id="chartYear"></span></div>
      <div id="chart"></div>
    </div>
  </section>

  <section class="controls" aria-label="Penapis">
    <div class="tabs" id="tabs" role="group" aria-label="Kategori"></div>
    <input class="search" id="q" type="search" placeholder="Cari item…" aria-label="Cari item">
  </section>

  <main class="grid" id="grid"></main>
</div>

<!-- Dialog: item -->
<dialog id="dlgItem"><form class="dlg" id="formItem" method="dialog">
  <div class="dlg-head"><h2 id="itemTitle">Item baharu</h2><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
  <div class="kat-pick" id="katPick"></div>
  <div class="form">
    <label class="full">Nama<input id="iNama" required placeholder="cth. Perodua Myvi, Aircond bilik tidur"></label>
    <label class="full">Butiran <span class="hint">no. pendaftaran, model, lokasi</span><input id="iButiran" placeholder="cth. TCA 1234 / ruang tamu"></label>
    <label id="iOdoWrap">Odometer semasa (km)<input id="iOdo" type="number" min="0" inputmode="numeric"></label>
    <label>Selang servis (bulan)<input id="iBulan" type="number" min="0" inputmode="numeric" placeholder="cth. 6"></label>
    <label id="iKmWrap">Selang servis (km)<input id="iKm" type="number" min="0" inputmode="numeric" placeholder="cth. 10000"></label>
  </div>
  <div class="dlg-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" type="submit">Simpan</button></div>
</form></dialog>

<!-- Dialog: servis -->
<dialog id="dlgSvc"><form class="dlg" id="formSvc" method="dialog">
  <div class="dlg-head"><div><h2>Rekod servis</h2><p class="sub" id="sItem"></p></div><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
  <div class="form">
    <label>Tarikh servis<input id="sTarikh" type="date" required></label>
    <label>Kos (RM)<input id="sKos" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
    <label class="full">Jenis servis<input id="sJenis" required list="jenisList" placeholder="cth. Tukar minyak enjin"></label>
    <datalist id="jenisList"><option>Tukar minyak enjin</option><option>Servis berkala</option><option>Tukar tayar</option><option>Tukar bateri</option><option>Cuci aircond</option><option>Tukar filter</option><option>Tukar brek pad</option></datalist>
    <label id="sOdoWrap">Odometer (km)<input id="sOdo" type="number" min="0" inputmode="numeric"></label>
    <label>Bengkel / pembekal<input id="sBengkel" placeholder="cth. Bengkel Ah Seng"></label>
    <label>Servis seterusnya (tarikh)<input id="sNextD" type="date"><span class="hint">dicadang daripada selang servis</span></label>
    <label id="sNextKmWrap">Servis seterusnya (km)<input id="sNextKm" type="number" min="0" inputmode="numeric"></label>
    <label class="full">Nota<textarea id="sNota" placeholder="Bahagian ditukar, jenama, waranti…"></textarea></label>
    <label class="full">Lampiran <span class="hint">gambar resit atau bengkel</span><input id="sFail" type="file" accept="image/*"></label>
  </div>
  <div class="dlg-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" type="submit">Simpan servis</button></div>
</form></dialog>

<!-- Dialog: butiran -->
<dialog id="dlgDetail"><div class="dlg" id="detailBody"></div></dialog>

<!-- Dialog: tetapan -->
<dialog id="dlgSet"><form class="dlg" id="formSet" method="dialog">
  <div class="dlg-head"><h2>Sambungan Google Sheets</h2><button type="button" class="x" data-close aria-label="Tutup">✕</button></div>
  <label>URL Web App (Apps Script)<input id="setUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <p class="hint">Kosongkan URL untuk guna mod tempatan (data disimpan dalam pelayar ini sahaja). Jangan kongsi URL ini kepada orang lain.</p>
  <div class="dlg-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" type="submit">Simpan &amp; sambung</button></div>
</form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- kategori ---------- */
const ICONS={
 kereta:'<path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v5h-3v-2H6v2H3z"/><circle cx="7.5" cy="14" r=".8"/><circle cx="16.5" cy="14" r=".8"/>',
 motor:'<circle cx="5.5" cy="16" r="3"/><circle cx="18.5" cy="16" r="3"/><path d="M5.5 16l3-6h5l3 6M12 10l-1-3H9M14 7h3"/>',
 aircond:'<rect x="3" y="5" width="18" height="7" rx="2"/><path d="M7 16c0 2-1 3-1 4M12 16c0 2-1 3-1 4M17 16c0 2-1 3-1 4"/>',
 water:'<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/><path d="M9 15a3 3 0 0 0 3 3"/>',
 lain:'<path d="M14.5 6a4 4 0 0 0 4.7 5L10 20.2a2.1 2.1 0 0 1-3-3L16 8.4"/><path d="M14 6l3-3 3 3-3 3"/>'
};
const KAT={
 kereta:{n:'Kereta',veh:true},motor:{n:'Motosikal',veh:true},
 aircond:{n:'Aircond'},water:{n:'Water filter'},lain:{n:'Lain-lain'}
};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.lain}</svg>`;

/* ---------- tarikh ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return iso(d)};
const diffDays=(a,b)=>Math.round((b-a)/864e5);
const fmtD=s=>s?parse(s).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'}):'-';
const rm=n=>'RM '+(+n||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const km=n=>(+n).toLocaleString('ms-MY')+' km';

/* ---------- pengiraan status ---------- */
function info(item){
  const sv=state.servis.filter(s=>s.itemId===item.id).sort((a,b)=>b.tarikh.localeCompare(a.tarikh));
  const last=sv[0],T=today();
  const odo=Math.max(+item.odo||0,...sv.map(s=>+s.odo||0));
  let dueDate=null,dueKm=null;
  if(last){
    dueDate=last.seterusTarikh||(+item.selangBulan?addMonths(last.tarikh,+item.selangBulan):null);
    dueKm=+last.seterusKm||((+item.selangKm&&+last.odo)?+last.odo+ +item.selangKm:null);
  }
  const days=dueDate?diffDays(T,parse(dueDate)):null;
  const kml=dueKm?dueKm-odo:null;
  let st='none',label='Belum ada rekod',prog=0;
  if(last&&(dueDate||dueKm)){
    const bad=(days!==null&&days<0)||(kml!==null&&kml<=0);
    const soon=(days!==null&&days<=30)||(kml!==null&&kml<=500);
    st=bad?'bad':soon?'warn':'ok';
    const parts=[];
    if(days!==null)parts.push(days<0?`Lewat ${-days} hari`:days===0?'Hari ini':`${days} hari lagi`);
    if(kml!==null)parts.push(kml<=0?`Lewat ${km(-kml)}`:`${km(kml)} lagi`);
    label=bad?(parts.find(p=>p.startsWith('Lewat'))):(st==='ok'?'Baik':parts[0]);
    const f=[];
    if(dueDate){const tot=diffDays(parse(last.tarikh),parse(dueDate))||1;f.push(diffDays(parse(last.tarikh),T)/tot)}
    if(dueKm&&+last.odo){const tot=(dueKm-last.odo)||1;f.push((odo-last.odo)/tot)}
    prog=Math.max(0,Math.min(1,Math.max(...f)));
  }else if(last){st='ok';label='Direkod';prog=0}
  const rank={bad:0,warn:1,none:2,ok:3}[st];
  const jumlahKos=sv.reduce((a,s)=>a+(+s.kos||0),0);
  return {sv,last,odo,dueDate,dueKm,days,kml,st,label,prog,rank,jumlahKos};
}

    <div class="stat bad"><b class="num">${c.bad}</b><small>Lewat servis</small></div>
    <div class="stat warn"><b class="num">${c.warn}</b><small>Akan tiba</small></div>
    <div class="stat ok"><b class="num">${c.ok}</b><small>Dalam keadaan baik</small></div>

  renderChart();

    .sort((a,b)=>a.f.rank-b.f.rank||(a.f.days??9e9)-(b.f.days??9e9));
  $('#grid').innerHTML=list.length?list.map(({i,f})=>{
    const veh=KAT[i.kategori]?.veh;
    return `<article class="card" tabindex="0" data-id="${esc(i.id)}" data-act="detail">
      <div class="card-top"><span class="ico">${svg(i.kategori)}</span>
        <div><h3>${esc(i.nama)}${i.contoh?'<span class="tag">contoh</span>':''}</h3><p class="sub">${esc(i.butiran)||KAT[i.kategori]?.n||''}</p></div>
        <span class="pill ${f.st}">${esc(f.label)}</span></div>
      <div class="meter ${f.st}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f.prog*100)}" aria-label="Kemajuan ke servis seterusnya"><i style="width:${Math.round(f.prog*100)}%"></i></div>
      <dl class="facts">
        <div><dt>Servis akhir</dt><dd>${f.last?fmtD(f.last.tarikh):'-'}</dd></div>
        <div><dt>Seterusnya</dt><dd>${f.dueDate?fmtD(f.dueDate):(f.dueKm?km(f.dueKm):'-')}</dd></div>
        ${veh?`<div><dt>Odometer</dt><dd class="num">${f.odo?km(f.odo):'-'}</dd></div>`:''}
        <div><dt>Jumlah kos</dt><dd class="num">${rm(f.jumlahKos)}</dd></div>
      </dl>
      <div class="card-actions"><button class="btn sm primary" data-act="addsvc" data-id="${esc(i.id)}">+ Servis</button><button class="btn sm" data-act="detail" data-id="${esc(i.id)}">Sejarah</button></div>
    </article>`}).join(''):
    `<div class="empty" style="grid-column:1/-1"><h3>${state.items.length?'Tiada padanan':'Belum ada item'}</h3><p>${state.items.length?'Cuba ubah penapis atau carian.':'Tekan “Tambah item” untuk mula merekod kereta, motor, aircond atau water filter.'}</p></div>`;
  // banner mod
  const demo=state.items.some(i=>i.contoh);
  $('#banner').hidden=!(demo||!url);
  $('#bannerText').textContent=demo?'Data contoh dipaparkan. Padamkannya sebelum mula rekod sebenar.':'Mod tempatan: data disimpan dalam pelayar ini sahaja. Tekan Sambungan untuk guna Google Sheets.';
  $('#btnClearDemo').hidden=!demo;
}

function renderChart(){
  const T=today(),months=[];
  for(let k=5;k>=0;k--){const d=new Date(T.getFullYear(),T.getMonth()-k,1);months.push({key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,l:d.toLocaleDateString('ms-MY',{month:'short'}),v:0})}
  state.servis.forEach(s=>{const m=months.find(x=>s.tarikh.startsWith(x.key));if(m)m.v+=+s.kos||0});
  const total=months.reduce((a,m)=>a+m.v,0);
  $('#chartTotal').textContent=rm(total);
  const yr=state.servis.filter(s=>s.tarikh.startsWith(String(T.getFullYear()))).reduce((a,s)=>a+(+s.kos||0),0);
  $('#chartYear').textContent=`Tahun ${T.getFullYear()}: ${rm(yr)}`;
  const max=Math.max(100,...months.map(m=>m.v)),W=420,H=170,L=8,B=24,top=22,bw=44,gap=(W-L*2-bw*6)/5;
  const y=v=>top+(H-top-B)*(1-v/max);
  let g=`<line class="grid" x1="${L}" x2="${W-L}" y1="${y(0)}" y2="${y(0)}"/><line class="grid" x1="${L}" x2="${W-L}" y1="${y(max/2)}" y2="${y(max/2)}"/>`;
  months.forEach((m,i)=>{const x=L+i*(bw+gap),yy=y(m.v);
    g+=`<g><title>${m.l}: ${rm(m.v)}</title><rect class="bar${i===5?' cur':''}" x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,y(0)-yy)}" rx="6"/>
    ${m.v?`<text class="val" x="${x+bw/2}" y="${yy-5}" text-anchor="middle">${Math.round(m.v)}</text>`:''}
    <text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${m.l}</text></g>`});
  $('#chart').innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kos servis bulanan dalam ringgit">${g}</svg>`;
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function setSync(mode,text){const s=$('#sync');s.className='chip-sync '+mode;s.querySelector('span').textContent=text}

/* ---------- sambungan Google Sheets ---------- */
async function api(body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),credentials:'omit',referrerPolicy:'no-referrer'});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Ralat');return j;
}
async function push(body){
  saveLocal();
  if(!url)return {};
  setSync('busy','Menyimpan…');
  try{const j=await api(body);setSync('on','Disambung');return j}
  catch(e){setSync('err','Gagal simpan');toast('Gagal simpan ke Sheets. Data kekal dalam pelayar.');return {}}
}
async function pull(){
  if(!url){setSync('','Tempatan');return}
  setSync('busy','Memuat turun…');
  try{
    const j=await api({action:'list'});
    state={items:j.items,servis:j.servis};saveLocal();setSync('on','Disambung');render();
  }catch(e){setSync('err','Tiada sambungan');toast('Tidak dapat memuat turun dari Sheets.')}
}

function readImage(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
    img.onerror=rej;img.src=u;
  });
}
$('#sFail').addEventListener('change',async e=>{
  const f=e.target.files[0];fileData=null;if(!f)return;
  try{fileData={thumb:await readImage(f,120,.6),full:await readImage(f,1280,.72)}}catch(err){toast('Gambar tidak dapat dibaca')}
});

    odo:$('#sOdo').value,bengkel:$('#sBengkel').value.trim(),nota:$('#sNota').value.trim(),
    seterusTarikh:$('#sNextD').value,seterusKm:$('#sNextKm').value,lampiranUrl:'',thumb:fileData?fileData.thumb:''};
  state.servis.push(row);
  if(+row.odo&&+row.odo>(+svcItem.odo||0)){svcItem.odo=row.odo;push({action:'upsert',sheet:'Item',row:cleanItem(svcItem)})}
  $('#dlgSvc').close();render();toast('Servis direkodkan');
  if(detailId===row.itemId)openDetail(row.itemId,true);
  const body={action:'upsert',sheet:'Servis',row};
  if(fileData&&url)body.file={mime:'image/jpeg',data:fileData.full.split(',')[1]};
  const j=await push(body);
  if(j.row&&j.row.lampiranUrl){row.lampiranUrl=j.row.lampiranUrl;saveLocal()}
});
const cleanItem=i=>({id:i.id,kategori:i.kategori,nama:i.nama,butiran:i.butiran,odo:i.odo,selangBulan:i.selangBulan,selangKm:i.selangKm});

function armDelete(btn,fn){
  if(btn.dataset.armed){fn();return}
  const t=btn.textContent;btn.dataset.armed=1;btn.textContent='Pasti? Tekan lagi';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},3000);
}

});

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#btnInstall').hidden=false});
$('#btnInstall').addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#btnInstall').hidden=true});
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true;toast('App dipasang')});
window.addEventListener('online',()=>{if(url)pull()});

/* ---------- mula ---------- */
buildKatPick();loadLocal();render();
if(url)pull();else setSync('','Tempatan');
})();
</script>
